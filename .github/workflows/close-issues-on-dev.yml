name: Close linked issues on dev

# GitHub only honours "Fixes #N" when a PR merges into the default branch
# (main). Day-to-day PRs merge into dev, so this closes the issues they name
# as soon as the fix lands there.
#
# pull_request_target is used so PRs from forks get a token that can close
# issues. It is safe here: the job never checks out or runs PR code, and PR
# text is only read through the API, never interpolated into the script.
on:
  pull_request_target:
    types: [closed]
    branches: [dev]

permissions: {}

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Close issues named with a closing keyword
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          text="$(gh pr view "$PR" --json body,commits \
            --jq '[.body // "", (.commits[] | .messageHeadline + "\n" + .messageBody)] | join("\n")')"

          # Same keywords GitHub accepts: close/closes/closed, fix/fixes/fixed,
          # resolve/resolves/resolved, optionally followed by a colon.
          issues="$(printf '%s\n' "$text" \
            | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+$' | sort -un || true)"

          if [ -z "$issues" ]; then
            echo "No closing keywords found."
            exit 0
          fi

          for n in $issues; do
            info="$(gh api "repos/$GH_REPO/issues/$n" --jq '[.state, (.pull_request != null)] | @tsv' 2>/dev/null)" \
              || { echo "#$n: not found, skipping"; continue; }
            state="${info%%$'\t'*}"; is_pr="${info##*$'\t'}"
            if [ "$is_pr" = "true" ]; then echo "#$n: is a PR, skipping"; continue; fi
            if [ "$state" != "open" ]; then echo "#$n: already $state"; continue; fi
            gh issue close "$n" --reason completed --comment "Closed by #$PR, merged into \`dev\`."
            echo "#$n: closed"
          done
